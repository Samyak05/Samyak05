<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="700"
    viewBox="0 0 1200 700">

    <!-- ========================================================= -->
    <!-- Background -->
    <!-- ========================================================= -->

    <rect
        width="1200"
        height="700"
        fill="#0d1117"/>

    <!-- ========================================================= -->
    <!-- Terminal Window -->
    <!-- ========================================================= -->

    <rect
        x="80"
        y="50"
        width="1040"
        height="620"
        rx="12"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

    <!-- ========================================================= -->
    <!-- Header -->
    <!-- ========================================================= -->

    <g id="header">

        <!-- macOS Window Buttons -->
        <circle cx="110" cy="78" r="8" fill="#ff5f56"/>
        <circle cx="135" cy="78" r="8" fill="#ffbd2e"/>
        <circle cx="160" cy="78" r="8" fill="#27c93f"/>

        <!-- Terminal Title -->
        <text
            x="600"
            y="84"
            text-anchor="middle"
            font-family="monospace"
            font-size="22"
            fill="#c9d1d9">

            samyak@opensuse

        </text>

        <!-- Header Divider -->
        <line
            x1="80"
            y1="105"
            x2="1120"
            y2="105"
            stroke="#30363d"
            stroke-width="2"/>

    </g>

    <!-- ========================================================= -->
    <!-- Left Panel -->
    <!-- ========================================================= -->

    <g id="left-panel">

        <!-- Panel Divider -->
        <line
            x1="420"
            y1="120"
            x2="420"
            y2="650"
            stroke="#30363d"
            stroke-width="2"/>

        <!--
            Generated ASCII portrait will be inserted here.

            The Python generator will replace this placeholder
            with multiple <text> elements representing the
            generated ASCII art.
        -->

        <!-- {{ascii.portrait}} -->

    </g>

    <!-- ========================================================= -->
    <!-- Right Panel -->
    <!-- ========================================================= -->

    <g
        id="right-panel"
        font-family="monospace"
        font-size="20">

        <!-- ===================================================== -->
        <!-- Identity -->
        <!-- ===================================================== -->

        <g id="identity">

            <!-- Username -->

            <text
                id="username"
                x="470"
                y="150"
                font-size="24"
                fill="#c9d1d9">

                {{identity.username}}

            </text>

            <!--
                Underline length will be generated dynamically
                according to username length.
            -->

            <line
                id="username-underline"
                x1="470"
                y1="165"
                x2="720"
                y2="165"
                stroke="#c9d1d9"
                stroke-width="2"/>

            <!-- Future tagline -->

            <!-- {{identity.tagline}} -->

        </g>

        <!-- ===================================================== -->
        <!-- System Information -->
        <!-- ===================================================== -->

        <g id="system-info">

            <!-- Label -->

            <text
                x="470"
                y="205"
                fill="#d19a66">

                OS:

            </text>

            <!-- Dot Leader -->

            <text
                x="520"
                y="205"
                fill="#7d8590">

                ....................

            </text>

            <!-- Value -->

            <text
                x="760"
                y="205"
                fill="#c9d1d9">

                {{system.os}}

            </text>

        </g>

        <!-- ===================================================== -->
        <!-- Languages -->
        <!-- ===================================================== -->

        <g id="languages">

            <!-- Future rows -->

            <!-- {{languages.*}} -->

        </g>

        <!-- ===================================================== -->
        <!-- Tools -->
        <!-- ===================================================== -->

        <g id="tools">

            <!-- {{tools.*}} -->

        </g>

        <!-- ===================================================== -->
        <!-- Projects -->
        <!-- ===================================================== -->

        <g id="projects">

            <!-- {{projects.*}} -->

        </g>

        <!-- ===================================================== -->
        <!-- Contact -->
        <!-- ===================================================== -->

        <g id="contact">

            <!-- {{contact.*}} -->

        </g>

        <!-- ===================================================== -->
        <!-- GitHub Statistics -->
        <!-- ===================================================== -->

        <g id="github">

            <!-- {{github.*}} -->

        </g>

    </g>

</svg>