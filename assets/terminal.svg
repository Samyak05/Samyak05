<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="700"
    viewBox="0 0 1200 700">

    <!-- ========================================================= -->
    <!-- Background -->
    <!-- ========================================================= -->

    <rect
        width="1200"
        height="700"
        fill="#0d1117"/>

    <!-- ========================================================= -->
    <!-- Terminal Window -->
    <!-- ========================================================= -->

    <rect
        x="80"
        y="50"
        width="1040"
        height="620"
        rx="12"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

    <!-- ========================================================= -->
    <!-- Header -->
    <!-- ========================================================= -->

    <g id="header">

        <!-- macOS Window Buttons -->
        <circle cx="110" cy="78" r="8" fill="#ff5f56"/>
        <circle cx="135" cy="78" r="8" fill="#ffbd2e"/>
        <circle cx="160" cy="78" r="8" fill="#27c93f"/>

        <!-- Terminal Title -->
        <text
            x="600"
            y="84"
            text-anchor="middle"
            font-family="monospace"
            font-size="22"
            fill="#c9d1d9">

            samyak@opensuse

        </text>

        <!-- Header Divider -->
        <line
            x1="80"
            y1="105"
            x2="1120"
            y2="105"
            stroke="#30363d"
            stroke-width="2"/>

    </g>

    def line(x1, y1, x2, y2, color="#c9d1d9", width=2):
    return f'''
    <line
        x1="{x1}"
        y1="{y1}"
        x2="{x2}"
        y2="{y2}"
        stroke="{color}"
        stroke-width="{width}"/>
    '''

    <!-- ========================================================= -->
    <!-- Left Panel -->
    <!-- ========================================================= -->

    <g id="left-panel">

        <!-- Panel Divider -->
        <line
            x1="420"
            y1="120"
            x2="420"
            y2="650"
            stroke="#30363d"
            stroke-width="2"/>

        {{ascii}}

    </g>

    <!-- ========================================================= -->
    <!-- Right Panel -->
    <!-- ========================================================= -->

    <g
        id="right-panel"
        font-family="monospace"
        font-size="20">

        <!-- ===================================================== -->
        <!-- Identity -->
        <!-- ===================================================== -->

        <g id="identity-section">

            <text
        x="470"
        y="150"
        text-anchor="start"
        font-size="24"
        fill="#c9d1d9">samyak@opensuse</text>
<text
        x="470"
        y="170"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">---------------</text>
<text
        x="470"
        y="205"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">M.Tech Computer Science Student</text>
<text
        x="470"
        y="235"
        text-anchor="start"
        font-size="20"
        fill="#7d8590">Linux • Networking • DevOps • Security</text>

        </g>

        <!-- ===================================================== -->
        <!-- System Information -->
        <!-- ===================================================== -->

        <g id="system-section">

            <text
        x="470"
        y="290"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">OS:....................... openSUSE Tumbleweed</text>
<text
        x="470"
        y="320"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">Kernel:................... Linux 6.16</text>
<text
        x="470"
        y="350"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">Shell:.................... fish</text>
<text
        x="470"
        y="380"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">Editor:................... VS Code</text>

        </g>

        <!-- ===================================================== -->
        <!-- Languages -->
        <!-- ===================================================== -->

        <g id="languages-section">

            {{languages}}

        </g>

        <!-- ===================================================== -->
        <!-- Tools -->
        <!-- ===================================================== -->

        <g id="tools-section">

            {{tools}}

        </g>

        <!-- ===================================================== -->
        <!-- Projects -->
        <!-- ===================================================== -->

        <g id="projects-section">

            {{projects}}

        </g>

        <!-- ===================================================== -->
        <!-- Contact -->
        <!-- ===================================================== -->

        <g id="contact-section">

            {{contact}}

        </g>

        <!-- ===================================================== -->
        <!-- GitHub Statistics -->
        <!-- ===================================================== -->

        <g id="github-section">

            {{github}}

        </g>

    </g>

</svg>