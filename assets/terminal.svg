<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="700"
    viewBox="0 0 1200 700">

    <!-- ========================================================= -->
    <!-- Background -->
    <!-- ========================================================= -->

    <rect
        width="1200"
        height="700"
        fill="#0d1117"/>

    <!-- ========================================================= -->
    <!-- Terminal Window -->
    <!-- ========================================================= -->

    <rect
        x="80"
        y="50"
        width="1040"
        height="620"
        rx="12"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

    <!-- ========================================================= -->
    <!-- Header -->
    <!-- ========================================================= -->

    <g id="header">

        <!-- macOS Window Buttons -->
        <circle cx="110" cy="78" r="8" fill="#ff5f56"/>
        <circle cx="135" cy="78" r="8" fill="#ffbd2e"/>
        <circle cx="160" cy="78" r="8" fill="#27c93f"/>

        <!-- Terminal Title -->
        <text
            x="600"
            y="84"
            text-anchor="middle"
            font-family="monospace"
            font-size="22"
            fill="#c9d1d9">

            samyak@opensuse

        </text>

        <!-- Header Divider -->
        <line
            x1="80"
            y1="105"
            x2="1120"
            y2="105"
            stroke="#30363d"
            stroke-width="2"/>

    </g>


    <!-- ========================================================= -->
    <!-- Left Panel -->
    <!-- ========================================================= -->

    <g id="left-panel">

        <!-- Panel Divider -->
        <line
            x1="380"
            y1="120"
            x2="380"
            y2="650"
            stroke="#30363d"
            stroke-width="2"/>

        {{ascii}}

    </g>

    <!-- ========================================================= -->
    <!-- Right Panel -->
    <!-- ========================================================= -->

    <g
        id="right-panel"
        font-family="monospace"
        font-size="17">

        <!-- ===================================================== -->
        <!-- Identity -->
        <!-- ===================================================== -->

        <g id="identity-section">

            <text
        x="470"
        y="150"
        text-anchor="start"
        font-size="24"
        fill="#c9d1d9">samyak@opensuse</text>

    <line
        x1="470"
        y1="165"
        x2="650"
        y2="165"
        stroke="#c9d1d9"
        stroke-width="2"/>
    
<text
        x="470"
        y="205"
        text-anchor="start"
        font-size="20"
        fill="#c9d1d9">M.Tech Computer Science Student</text>
<text
        x="470"
        y="235"
        text-anchor="start"
        font-size="20"
        fill="#7d8590">Linux • Networking • DevOps • Security</text>

        </g>

        <!-- ===================================================== -->
        <!-- System Information -->
        <!-- ===================================================== -->

        <g id="system-section">

            <text x="470" y="290" font-size="20"><tspan fill="#d19a66">OS:</tspan><tspan fill="#7d8590">.......................</tspan><tspan fill="#a5d6ff"> openSUSE Tumbleweed</tspan></text>
<text x="470" y="320" font-size="20"><tspan fill="#d19a66">Kernel:</tspan><tspan fill="#7d8590">...................</tspan><tspan fill="#a5d6ff"> Linux 6.16</tspan></text>
<text x="470" y="350" font-size="20"><tspan fill="#d19a66">Shell:</tspan><tspan fill="#7d8590">....................</tspan><tspan fill="#a5d6ff"> fish</tspan></text>
<text x="470" y="380" font-size="20"><tspan fill="#d19a66">Editor:</tspan><tspan fill="#7d8590">...................</tspan><tspan fill="#a5d6ff"> VS Code</tspan></text>

        </g>

        <!-- ===================================================== -->
        <!-- Languages -->
        <!-- ===================================================== -->

        <g id="languages-section">

            <text x="470" y="450" font-size="20"><tspan fill="#d19a66">Languages.</tspan><tspan fill="#d19a66">Programming</tspan><tspan fill="#7d8590">:.....</tspan><tspan fill="#a5d6ff"> Java, Python, C, C++</tspan></text>
<text x="470" y="480" font-size="20"><tspan fill="#d19a66">Languages.</tspan><tspan fill="#d19a66">Scripting</tspan><tspan fill="#7d8590">:.......</tspan><tspan fill="#a5d6ff"> Bash</tspan></text>
<text x="470" y="510" font-size="20"><tspan fill="#d19a66">Languages.</tspan><tspan fill="#d19a66">Markup</tspan><tspan fill="#7d8590">:..........</tspan><tspan fill="#a5d6ff"> Markdown, HTML, YAML</tspan></text>

        </g>

        <!-- ===================================================== -->
        <!-- Tools -->
        <!-- ===================================================== -->

        <g id="tools-section">

            <text x="470" y="540" font-size="20"><tspan fill="#d19a66">Tools.</tspan><tspan fill="#d19a66">Development</tspan><tspan fill="#7d8590">:.......</tspan><tspan fill="#a5d6ff"> Git, GitHub, IntelliJ IDEA</tspan></text>
<text x="470" y="570" font-size="20"><tspan fill="#d19a66">Tools.</tspan><tspan fill="#d19a66">Networking</tspan><tspan fill="#7d8590">:........</tspan><tspan fill="#a5d6ff"> Wireshark, tcpdump, OpenSSL</tspan></text>
<text x="470" y="600" font-size="20"><tspan fill="#d19a66">Tools.</tspan><tspan fill="#d19a66">Linux</tspan><tspan fill="#7d8590">:.............</tspan><tspan fill="#a5d6ff"> Network Namespaces, iproute2</tspan></text>

        </g>

        <!-- ===================================================== -->
        <!-- Projects -->
        <!-- ===================================================== -->

        <g id="projects-section">

            {{projects}}

        </g>

        <!-- ===================================================== -->
        <!-- Contact -->
        <!-- ===================================================== -->

        <g id="contact-section">

            {{contact}}

        </g>

        <!-- ===================================================== -->
        <!-- GitHub Statistics -->
        <!-- ===================================================== -->

        <g id="github-section">

            {{github}}

        </g>

    </g>

</svg>