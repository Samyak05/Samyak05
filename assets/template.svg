<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="700"
    viewBox="0 0 1200 700">

    <!-- ========================================================= -->
    <!-- Background -->
    <!-- ========================================================= -->

    <rect
        width="1200"
        height="700"
        fill="#0d1117"/>

    <!-- ========================================================= -->
    <!-- Terminal Window -->
    <!-- ========================================================= -->

    <rect
        x="80"
        y="50"
        width="1040"
        height="620"
        rx="12"
        fill="#161b22"
        stroke="#30363d"
        stroke-width="2"/>

    <!-- ========================================================= -->
    <!-- Header -->
    <!-- ========================================================= -->

    <g id="header">

        <!-- macOS Window Buttons -->
        <circle cx="110" cy="78" r="8" fill="#ff5f56"/>
        <circle cx="135" cy="78" r="8" fill="#ffbd2e"/>
        <circle cx="160" cy="78" r="8" fill="#27c93f"/>

        <!-- Terminal Title -->
        <text
            x="600"
            y="84"
            text-anchor="middle"
            font-family="monospace"
            font-size="22"
            fill="#c9d1d9">

            samyak@opensuse

        </text>

        <!-- Header Divider -->
        <line
            x1="80"
            y1="105"
            x2="1120"
            y2="105"
            stroke="#30363d"
            stroke-width="2"/>

    </g>


    <!-- ========================================================= -->
    <!-- Left Panel -->
    <!-- ========================================================= -->

    <g id="left-panel">

        <!-- Panel Divider -->
        <line
            x1="380"
            y1="120"
            x2="380"
            y2="650"
            stroke="#30363d"
            stroke-width="2"/>

        {{ascii}}

    </g>

    <!-- ========================================================= -->
    <!-- Right Panel -->
    <!-- ========================================================= -->

    <g
        id="right-panel"
        font-family="monospace"
        font-size="17">

        <!-- ===================================================== -->
        <!-- Identity -->
        <!-- ===================================================== -->

        <g id="identity-section">

            {{identity}}

        </g>

        <!-- ===================================================== -->
        <!-- System Information -->
        <!-- ===================================================== -->

        <g id="system-section">

            {{system}}

        </g>

        <!-- ===================================================== -->
        <!-- Languages -->
        <!-- ===================================================== -->

        <g id="languages-section">

            {{languages}}

        </g>

        <!-- ===================================================== -->
        <!-- Tools -->
        <!-- ===================================================== -->

        <g id="tools-section">

            {{tools}}

        </g>

        <!-- ===================================================== -->
        <!-- Projects -->
        <!-- ===================================================== -->

        <g id="projects-section">

            {{projects}}

        </g>

        <!-- ===================================================== -->
        <!-- Contact -->
        <!-- ===================================================== -->

        <g id="contact-section">

            {{contact}}

        </g>

        <!-- ===================================================== -->
        <!-- GitHub Statistics -->
        <!-- ===================================================== -->

        <g id="github-section">

            {{github}}

        </g>

    </g>

</svg>