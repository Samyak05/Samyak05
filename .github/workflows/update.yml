name: Update Profile Card Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main # Automatically runs whenever you push changes to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Updated SVG Card
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: 'Samyak05'
        run: python generate_readme.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update uptime and github stats [skip ci]"
          file_pattern: "github-profile.svg"